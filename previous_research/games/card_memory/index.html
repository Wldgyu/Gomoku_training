<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기억 반전 게임 (Reverse Memory)</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* 화면 흔들림 효과 */
        @keyframes screen-shake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-5px, 5px); }
            20%, 40%, 60%, 80% { transform: translate(5px, -5px); }
        }
        .shake-effect {
            animation: screen-shake 0.4s ease-in-out;
        }

        #game-container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            transition: transform 0.1s;
        }

        #status-panel {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
            align-items: center;
        }

        #focus-badge {
            color: #ff9f43;
            font-size: 1rem;
            display: none;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 0.4; } to { opacity: 1; }
        }

        #timer-bar-container {
            width: 100%;
            height: 8px;
            background-color: #444;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background-color: #ff4757;
            transition: width 0.1s linear;
        }

        #instruction {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 40px;
            min-height: 50px;
            color: #ffa502;
            transition: all 0.3s ease;
            line-height: 1.4;
        }

        #card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s, opacity 0.2s;
            border: 3px solid transparent;
            position: relative;
        }

        /* [피드백 반영] 카드 등장 화려한 임펙트 애니메이션 */
        @keyframes card-appear-ani {
            0% { transform: scale(0.5) rotateY(-90deg); opacity: 0; filter: brightness(2); }
            60% { transform: scale(1.1) rotateY(10deg); opacity: 1; }
            100% { transform: scale(1) rotateY(0deg); filter: brightness(1); }
        }
        .card-appear {
            animation: card-appear-ani 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 심리 함정용 페이크 흔들림 애니메이션 */
        @keyframes fake-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .fake-shake {
            animation: fake-shake 0.2s ease-in-out infinite;
        }

        .card-blink { animation: card-blink-ani 0.3s ease; }
        @keyframes card-blink-ani {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.1; }
        }

        .card:active {
            transform: scale(0.95);
        }

        @media (hover: hover) {
            .card:hover {
                box-shadow: 0 12px 20px rgba(0,0,0,0.4);
                background-color: #383838;
            }
        }

        .pe-none {
            pointer-events: none;
        }

        /* 홈 화면 및 게임오버 화면 (오버레이) */
        #screen-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-over-title {
            font-size: 3rem;
            color: #ffa502;
            margin-bottom: 20px;
            font-weight: 900;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 200px;
        }

        .btn {
            color: white;
            border: none;
            padding: 15px 0;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-start {
            background-color: #2ed573;
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);
        }
        .btn-start:hover { background-color: #26af5f; }

        .btn-info {
            background-color: #1e90ff;
            box-shadow: 0 5px 15px rgba(30, 144, 255, 0.4);
        }
        .btn-info:hover { background-color: #1a7edd; }

        /* 간략한 게임 설명 모달 팝업 */
        #desc-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .modal-content {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 20px;
            max-width: 350px;
            width: 80%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            margin-top: 0;
            color: #1e90ff;
        }

        .modal-content p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: left;
        }

        .btn-close {
            background-color: #747d8c;
            width: 100%;
        }
        .btn-close:hover { background-color: #57606f; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="status-panel">
            <div id="stage-display">STAGE 1</div>
            <div id="focus-badge">🔥 FOCUS MODE</div>
            <div id="score-display">SCORE: 0</div>
        </div>
        <div id="timer-bar-container">
            <div id="timer-bar"></div>
        </div>

        <div id="instruction">기억하세요!</div>

        <div id="card-grid" class="pe-none">
            <div class="card" onclick="checkAnswer(0)">-</div>
            <div class="card" onclick="checkAnswer(1)">-</div>
            <div class="card" onclick="checkAnswer(2)">-</div>
            <div class="card" onclick="checkAnswer(3)">-</div>
        </div>
    </div>

    <div id="screen-overlay">
        <h1 id="game-over-title">기억 반전 게임</h1>
        <div class="btn-group">
            <button id="start-btn" class="btn btn-start" onclick="startGame()">게임 시작</button>
            <button id="info-btn" class="btn btn-info" onclick="openModal()">게임 설명</button>
        </div>
    </div>

    <div id="desc-modal">
        <div class="modal-content">
            <h2>게임 방법</h2>
            <p>
                1. 처음에 화려하게 등장하는 4개의 카드를 완벽하게 기억하세요.<br><br>
                2. 스테이지가 올라갈수록 뇌를 흔드는 <b>심리전(유저 습관 낚시, 반응 속도 교란, 가짜 힌트)</b>이 시작됩니다.<br><br>
                3. 지시문을 정확히 읽고 <b>[틀린 것]</b> 혹은 <b>[안 바뀐 반전 카드]</b>를 정해진 시간 내에 터치하세요!
            </p>
            <button class="btn btn-close" onclick="closeModal()">닫기</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>

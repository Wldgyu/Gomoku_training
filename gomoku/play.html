<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>내 모델과 오목</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI","Malgun Gothic",sans-serif;color:#eef3fa;background:#0d1420}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#1c3047 0,transparent 55%),#0d1420;min-height:100vh}main{max-width:1120px;margin:0 auto;padding:38px 28px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.13em;color:#83b9d4;margin-bottom:9px}h1{font-size:30px;letter-spacing:-.04em;margin:0;font-weight:650}.badge{border:1px solid #31475b;color:#a9c2d2;border-radius:20px;padding:7px 13px;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:24px}.board-wrap{background:#172333;border:1px solid #2b3c50;border-radius:22px;padding:22px;box-shadow:0 20px 60px #0003}.board-top{display:flex;justify-content:space-between;color:#afc1d2;font-size:13px;margin:0 1px 17px}canvas{width:100%;aspect-ratio:1;display:block;border-radius:12px;cursor:pointer;touch-action:manipulation;outline-offset:5px}.hint{font-size:12px;color:#9fb0c2;text-align:center;margin:17px 0 0;line-height:1.7}.side{display:flex;flex-direction:column;gap:18px}.panel{background:#172333;border:1px solid #2b3c50;border-radius:18px;padding:22px}.label{font-size:12px;color:#94a9bd;margin-bottom:9px;display:block}select,button{font:inherit}select{width:100%;color:#f1f5fa;background:#0f1a28;border:1px solid #3b4d63;border-radius:10px;padding:12px;margin-bottom:19px}button{border:1px solid #3b4d63;border-radius:10px;background:#223347;color:#e3edf6;padding:11px 13px;cursor:pointer}button:hover{background:#2d435c}button:disabled{opacity:.45;cursor:wait}.colors{display:flex;gap:8px;margin-bottom:20px}.colors button{flex:1}.colors button.active{border-color:#80c9de;background:#284354;color:#d9faff}.primary{width:100%;background:#8ad1dc;color:#10212a;border:0;font-weight:650}.primary:hover{background:#a5e3eb}.status{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;min-height:30px}.dot{height:12px;width:12px;background:#82d4c2;border-radius:50%;box-shadow:0 0 16px #82d4c244}.detail{font-size:13px;line-height:1.7;color:#b2c1ce;margin:12px 0 0}.secondary{display:flex;gap:8px;margin-top:18px}.secondary button{flex:1;font-size:12px}.moves{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:9px;font-size:12px;color:#bbc9d6}.moves li{background:#101d2b;padding:9px;border-radius:8px}.error{color:#ffb5a5;font-size:13px;min-height:20px;margin-top:12px;line-height:1.6}footer{font-size:12px;line-height:1.8;color:#8095aa;margin-top:20px}h2{font-size:14px;margin:0;font-weight:600}.small{color:#8da4b9;font-size:12px;margin-top:9px}@media(max-width:780px){main{padding:22px 14px}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.board-wrap{padding:14px}header{margin-bottom:20px}h1{font-size:25px}.panel{padding:16px}.side>.panel:last-child{grid-column:1/-1}}@media(max-width:420px){.side{grid-template-columns:1fr}.badge{font-size:10px}.board-top{font-size:11px}}
</style></head><body><main>
<header><div><div class="eyebrow">GOMOKU · MY MODELS</div><h1>내 모델과 오목</h1></div><span class="badge">12 × 12 자유 오목</span></header>
<div class="layout"><section class="board-wrap"><div class="board-top"><span id="match">나 vs GRU</span><span id="count">0수</span></div><canvas id="board" width="720" height="720" tabindex="0" role="application" aria-label="12행 12열 오목판. 방향키로 이동하고 엔터로 착수합니다."></canvas><p class="hint" id="hint">흑의 첫 수는 중앙에 둡니다. 표시된 점을 눌러주세요.</p></section>
<aside class="side"><section class="panel"><label class="label" for="model">대결할 모델</label><select id="model"><option value="gru">GRU · 원본</option><option value="fly">Fly · 원본</option><option value="rnn">RNN · 원본</option><option value="rewired">재배열 Fly · 원본</option><option value="gru_wide">GRU · 넓은 트렁크 (방어 강화)</option><option value="rnn_wide">RNN · 넓은 트렁크 (방어 강화)</option><option value="rewired_wide">재배열 Fly · 넓은 트렁크 (방어 강화)</option><option value="fly_wide">Fly · 넓은 트렁크 (방어 강화)</option><option value="gru_quiet">GRU · 넓은 트렁크 + 초중반 공격 자료</option><option value="rnn_quiet">RNN · 넓은 트렁크 + 초중반 공격 자료</option><option value="rewired_quiet">재배열 Fly · 넓은 트렁크 + 초중반 공격 자료</option><option value="fly_quiet">Fly · 넓은 트렁크 + 초중반 공격 자료</option></select><span class="label">내 돌</span><div class="colors"><button id="black" class="active" aria-pressed="true">● 흑 · 먼저</button><button id="white" aria-pressed="false">○ 백 · 나중</button></div><button id="new" class="primary">새 대국</button><div id="error" class="error" role="alert"></div></section>
<section class="panel"><div class="status" aria-live="polite"><span class="dot"></span><span id="status">모델 준비 중</span></div><p class="detail" id="detail">돌을 5개 이상 연속으로 놓으면 승리합니다.</p><div class="secondary"><button id="undo">되돌리기</button><button id="export">기보 저장</button></div></section>
<section class="panel"><h2>최근 착수</h2><ol id="moves" class="moves"></ol><div class="small">좌표는 행 · 열 순서입니다.</div></section></aside></div>
<footer>AI는 선택한 학습 모델이 직접 둡니다. 흑 첫 수는 중앙으로 고정하며 금수는 없습니다.<br>대국은 이 PC에서 실행됩니다. 가중치는 변경되지 않습니다.</footer>
</main><script>
let game=null,human=1,busy=false,cursor=[5,5];const $=s=>document.querySelector(s),canvas=$('#board'),ctx=canvas.getContext('2d');const side=720,pad=42,step=(side-2*pad)/11;
function stone(x,y,color,last){ctx.save();ctx.shadowColor='#0006';ctx.shadowBlur=5;ctx.shadowOffsetY=3;const g=ctx.createRadialGradient(x-8,y-9,2,x,y,22);g.addColorStop(0,color===1?'#4b5155':'#ffffff');g.addColorStop(1,color===1?'#101318':'#d9e0e7');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,step*.39,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;if(last){ctx.strokeStyle=color===1?'#b3e8e5':'#357079';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,step*.19,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function draw(){const g=ctx.createLinearGradient(0,0,side,side);g.addColorStop(0,'#e4be7d');g.addColorStop(1,'#c99858');ctx.fillStyle=g;ctx.fillRect(0,0,side,side);ctx.strokeStyle='#75502a99';ctx.lineWidth=1.2;for(let i=0;i<12;i++){let q=pad+i*step;ctx.beginPath();ctx.moveTo(pad,q);ctx.lineTo(side-pad,q);ctx.moveTo(q,pad);ctx.lineTo(q,side-pad);ctx.stroke()}ctx.font='14px Segoe UI';ctx.fillStyle='#6c482d';ctx.textAlign='center';ctx.textBaseline='middle';for(let i=0;i<12;i++){ctx.fillText(i+1,pad+i*step,18);ctx.fillText(i+1,18,pad+i*step)}for(let r of [3,8])for(let c of [3,8]){ctx.beginPath();ctx.arc(pad+c*step,pad+r*step,3,0,Math.PI*2);ctx.fill()}if(game){game.board.forEach((v,i)=>{if(v)stone(pad+(i%12)*step,pad+Math.floor(i/12)*step,v,i===game.moves.at(-1))});if(!game.moves.length){ctx.strokeStyle='#24696e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(pad+5*step,pad+5*step,step*.22,0,Math.PI*2);ctx.stroke()}}if(document.activeElement===canvas){ctx.strokeStyle='#256374';ctx.lineWidth=3;ctx.strokeRect(pad+cursor[1]*step-15,pad+cursor[0]*step-15,30,30)}}
function render(){if(!game)return;$('#match').textContent=`나 vs ${game.name}`;$('#count').textContent=`${game.moves.length}수`;$('#status').textContent=busy?'AI가 생각하는 중…':game.finished?(game.winner===0?'무승부':game.winner===game.human?'내가 이겼습니다!':`${game.name} 승리`):`나의 차례 · ${game.human===1?'흑':'백'}`;$('#detail').textContent=game.finished?'새 대국으로 다시 도전할 수 있습니다.':`나는 ${game.human===1?'흑':'백'}, ${game.name}는 ${game.human===1?'백':'흑'}입니다.`;$('#hint').textContent=!game.moves.length?'흑의 첫 수는 중앙에 둡니다. 표시된 점을 눌러주세요.':game.finished?'대국이 끝났습니다.':'교차점을 눌러 착수하세요. 방향키와 엔터로도 둘 수 있습니다.';$('#moves').replaceChildren();game.moves.slice(-8).forEach((a,j)=>{let n=game.moves.length-Math.min(8,game.moves.length)+j,li=document.createElement('li');li.textContent=`${n+1}. ${n%2===0?'●':'○'} ${Math.floor(a/12)+1} · ${a%12+1}`;$('#moves').append(li)});draw()}
function lock(value){busy=value;document.querySelectorAll('button,select').forEach(e=>e.disabled=value);render()}
async function request(path,data){$('#error').textContent='';lock(true);try{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error);game=result;if(path==='/api/new'){cursor=[5,5];window.scrollTo({top:0,behavior:'smooth'})}render()}catch(e){$('#error').textContent=e.message}finally{lock(false)}}
function choose(color){human=color;$('#black').classList.toggle('active',color===1);$('#white').classList.toggle('active',color===-1);$('#black').setAttribute('aria-pressed',color===1);$('#white').setAttribute('aria-pressed',color===-1)}
$('#black').onclick=()=>choose(1);$('#white').onclick=()=>choose(-1);$('#new').onclick=()=>request('/api/new',{kind:$('#model').value,human});$('#undo').onclick=()=>{if(game)request('/api/undo',{id:game.id})};$('#export').onclick=()=>{if(!game)return;let data={size:12,model:game.name,human_color:game.human===1?'black':'white',winner:game.winner,moves:game.moves.map((a,i)=>({move:i+1,color:i%2===0?'black':'white',row:Math.floor(a/12)+1,column:a%12+1}))};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download=`gomoku-${game.kind}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function play(r,c){if(!game||busy||game.finished)return;cursor=[r,c];request('/api/move',{id:game.id,action:r*12+c})}
canvas.onclick=e=>{let rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*side/rect.width,y=(e.clientY-rect.top)*side/rect.height,c=Math.round((x-pad)/step),r=Math.round((y-pad)/step);if(r>=0&&r<12&&c>=0&&c<12)play(r,c)};
canvas.onkeydown=e=>{let [r,c]=cursor;if(e.key==='ArrowUp')r--;else if(e.key==='ArrowDown')r++;else if(e.key==='ArrowLeft')c--;else if(e.key==='ArrowRight')c++;else if(e.key==='Enter'||e.key===' '){e.preventDefault();play(r,c);return}else return;e.preventDefault();cursor=[Math.max(0,Math.min(11,r)),Math.max(0,Math.min(11,c))];draw()};canvas.onfocus=draw;canvas.onblur=draw;
draw();request('/api/new',{kind:'gru',human:1});
</script></body></html>
